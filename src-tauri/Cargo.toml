[package]
name = "ki-vault"
version = "0.1.0"
description = "Local-first desktop password and credential manager"
authors = ["KiVault Team"]
edition = "2021"

[lib]
name = "ki_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.4", features = [] }
tauri-plugin-opener = "2.2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
uuid = { version = "1.0", features = ["v4"] }
rusqlite = { version = "0.33", features = ["bundled", "serialize"] }
svg-hush = "0.9"
tauri-plugin-dialog = "2"
